spring:
  application:
    name: payment-platform
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration


  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paymentdb}
    username: ${DB_USER:paymentuser}
    password: ${DB_PASS:paymentpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: PaymentHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # kafka:
  #   bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  #   producer:
  #     key-serializer: org.apache.kafka.common.serialization.StringSerializer
  #     value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  #     acks: all
  #     retries: 3
  #     properties:
  #       enable.idempotence: true
  #       max.in.flight.requests.per.connection: 1
  #       spring.json.add.type.headers: false
  #   consumer:
  #     group-id: payment-platform-group
  #     auto-offset-reset: earliest
  #     key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  #     value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
  #     properties:
  #       spring.json.trusted.packages: "com.paymentplatform.kafka.*,com.paymentplatform.dto.*"
  #       spring.json.use.type.headers: false
  #       spring.json.value.default.type: com.paymentplatform.kafka.PaymentEvent
  #   listener:
  #     ack-mode: manual_immediate
  #     concurrency: 3

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

server:
  # Bind to the port provided by the hosting environment (Render sets $PORT).
  # Use the PORT env var when present, otherwise fall back to 8080.
  port: ${PORT:8080}
  # Ensure the server binds to all network interfaces inside the container.
  address: 0.0.0.0
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:ThisIsAVeryLongSecretKeyForJWTTokenGenerationThatIsAtLeast512BitsLongForHS512Algorithm}
    access-token-expiry: 900000      # 15 minutes
    refresh-token-expiry: 604800000  # 7 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  payment:
    max-retry-attempts: 3
    retry-delay-ms: 2000
    idempotency-ttl-seconds: 86400    # 24 hours
    rate-limit-requests: 100
    rate-limit-window-seconds: 60

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      paymentProcessor:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - com.paymentplatform.exception.PaymentProcessingException
  retry:
    instances:
      paymentProcessor:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - com.paymentplatform.exception.RetryablePaymentException
        ignoreExceptions:
          - com.paymentplatform.exception.InvalidPaymentException
  timelimiter:
    instances:
      paymentProcessor:
        timeoutDuration: 10s
        cancelRunningFuture: true

# Kafka Topics
kafka:
  topics:
    payment-created: payment.created
    payment-processed: payment.processed
    payment-failed: payment.failed
    payment-retry: payment.retry
    payment-reversed: payment.reversed
    notification: payment.notification
    dlq: payment.dlq

logging:
  level:
    com.paymentplatform: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.apache.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
  file:
    name: logs/payment-platform.log
