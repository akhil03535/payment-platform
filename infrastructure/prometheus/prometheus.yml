global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s
  external_labels:
    monitor: payflow
    environment: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: payment-platform-backend
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: [backend:8080]
    relabel_configs:
      - source_labels: [__address__]
        target_label:  instance
        replacement:   backend

  - job_name: kafka
    static_configs:
      - targets: [kafka:9092]

rule_files: []

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
